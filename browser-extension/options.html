<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>업무 데스크로 보내기 — 옵션</title>
<style>
  body { max-width: 600px; margin: 24px auto; padding: 0 16px; font: 14px/1.6 sans-serif; color: #222; }
  h2 { font-size: 15px; margin: 24px 0 4px; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  label.check { font-weight: 400; margin: 6px 0; }
  input[type=text], input[type=password], select, textarea { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
  textarea { height: 110px; }
  button { margin-top: 14px; padding: 6px 14px; cursor: pointer; }
  .ok { color: #1b7f3b; font-weight: 600; } .bad { color: #b3261e; font-weight: 600; }
  .muted { color: #666; font-size: 13px; }
</style>
</head>
<body>
<h1>업무 데스크로 보내기</h1>
<p class="muted">업무 데스크 ⚙ 설정 → "브라우저 단축키로 화면 보내기"에서 연결을 켜고, 거기에 보이는 연결 키를 아래에 붙여 넣으세요.</p>

<h2>연결</h2>
<label for="base">업무 데스크 주소 (이 PC 만 가능)</label>
<input id="base" type="text" placeholder="http://127.0.0.1:8770">
<label for="key">연결 키</label>
<input id="key" type="password" autocomplete="off">

<h2>무엇을 보낼지</h2>
<label for="mode">보내는 방식</label>
<select id="mode">
  <option value="auto">보고 있는 목록 자동 (권장) — 바깥 틀(메뉴·안내문)은 빼고, 마지막으로 누른 칸 또는 글이 가장 많은 칸 하나</option>
  <option value="pick">한 번 고른 칸 — 아이콘을 눌러 [이 칸만 보내기]로 고른 칸만</option>
  <option value="selection">마우스로 고른 글만 — 고른 글이 없으면 보내지 않음</option>
  <option value="all">화면 전체 — 모든 칸 (예전 방식)</option>
</select>
<p class="muted">어느 방식이든 글을 마우스로 드래그해 고른 뒤 누르면 고른 글만 보냅니다.</p>
<label class="check"><input id="skipTop" type="checkbox"> '화면 전체'에서도 바깥 틀(메뉴·안내문·로그인 정보)은 빼기</label>
<label class="check"><input id="inputs" type="checkbox"> 입력 칸의 글도 같이 보내기 (검색창 같은 것까지 들어갈 수 있음)</label>
<label class="check"><input id="preview" type="checkbox"> 보내기 전에 첫 몇 줄을 보여 주고 물어보기</label>

<label for="exclude">빼기 목록 (한 줄에 하나, 이 글이 든 줄은 보내지 않음)</label>
<textarea id="exclude"></textarea>

<button id="save">저장하고 연결 확인</button>
<p id="msg"></p>
<script type="module" src="options.js"></script>
</body>
</html>
