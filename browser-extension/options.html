<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>업무 데스크로 보내기 — 옵션</title>
<style>
  body { max-width: 560px; margin: 24px auto; padding: 0 16px; font: 14px/1.6 sans-serif; color: #222; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; }
  button { margin-top: 12px; padding: 6px 14px; cursor: pointer; }
  .ok { color: #1b7f3b; font-weight: 600; } .bad { color: #b3261e; font-weight: 600; }
  .muted { color: #666; font-size: 13px; }
</style>
</head>
<body>
<h1>업무 데스크로 보내기</h1>
<p class="muted">업무 데스크 ⚙ 설정 → "브라우저 단축키로 화면 보내기"에서 연결을 켜고, 거기에 보이는 연결 키를 아래에 붙여 넣으세요.</p>
<label for="base">업무 데스크 주소 (이 PC 만 가능)</label>
<input id="base" placeholder="http://127.0.0.1:8770">
<label for="key">연결 키</label>
<input id="key" type="password" autocomplete="off">
<button id="save">저장하고 연결 확인</button>
<p id="msg"></p>
<script type="module" src="options.js"></script>
</body>
</html>
